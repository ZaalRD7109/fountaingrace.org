<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Serve at Fountain of Grace</title>
<link rel="icon" href="/favicon.jpg">
<style>
  :root{
    --bg:#043838; --card:#0a4a4a; --card2:#0f5858; --line:#1c6b6b;
    --text:#f2fbfa; --dim:#a3cccc; --gold:#ffd700; --good:#7fe0cf;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 60px;min-height:100vh;display:flex;flex-direction:column}
  h1{font-size:22px;margin:6px 0 2px}
  .lead{color:var(--dim);font-size:15px;margin:0 0 20px}
  .bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin:2px 0 22px}
  .bar > i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
  label{display:block;font-size:14px;color:var(--dim);margin:14px 2px 6px}
  input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:14px;font-size:16px}
  .q{font-size:21px;line-height:1.4;font-weight:600;margin:6px 0 18px;min-height:70px}
  .heading{color:var(--gold);font-weight:700;font-size:15px;text-transform:none;margin:0 0 10px}
  .opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    color:var(--text);border-radius:14px;padding:16px;font-size:16px;margin:10px 0;line-height:1.4}
  .opt:active{background:var(--card2)}
  .disclosure{background:#062b2b;border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;color:var(--dim);font-size:13.5px;line-height:1.5;margin:8px 0 4px}
  .consent{display:flex;gap:11px;align-items:flex-start;margin:18px 2px 4px;color:var(--dim);font-size:13.5px;line-height:1.5}
  .consent input{width:24px;height:24px;flex:none;accent-color:var(--gold);margin-top:1px}
  .btn{appearance:none;border:0;background:var(--gold);color:#043838;font-weight:800;font-size:17px;
    border-radius:13px;padding:16px;width:100%;margin-top:22px}
  .btn:disabled{opacity:.45}
  .center{margin:auto 0;text-align:center}
  .center h1{font-size:24px}
  .center p{color:var(--dim);font-size:16px;line-height:1.6}
  .strong{color:var(--good);font-weight:700}
  .err{color:#ffbdbd;font-size:14px;margin-top:10px}
  .foot{color:var(--dim);font-size:12.5px;text-align:center;margin-top:18px}
  a{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="center"><p>Loading...</p></div></div>

<script>
const API = 'https://rmurdihrhcxevtzkrbmx.supabase.co/functions/v1/serve-test';
const SUBMIT_KEY = 'serve-submit-9f3c1a7b';
const wrap = document.getElementById('wrap');
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=null, answers={}, i=0, person={};

async function boot(){
  try{ const r=await fetch(API,{cache:'no-store'}); DATA=await r.json(); }
  catch(e){ wrap.innerHTML='<div class="center"><p>No connection. Check your data and try again.</p></div>'; return; }
  if(!DATA||!DATA.ok){ wrap.innerHTML='<div class="center"><p>Could not load. Please try again.</p></div>'; return; }
  start();
}

function start(){
  wrap.innerHTML =
    '<h1>Come and serve with us</h1>'+
    '<p class="lead">'+esc(DATA.intro)+'</p>'+
    '<label>Your name</label><input id="fn" autocomplete="given-name" placeholder="First name">'+
    '<label>Your surname</label><input id="sn" autocomplete="family-name" placeholder="Surname">'+
    '<label>Your WhatsApp number</label><input id="wa" inputmode="tel" autocomplete="tel" placeholder="e.g. 082 123 4567">'+
    '<div class="consent"><input type="checkbox" id="consent"><label for="consent" style="margin:0;color:var(--dim)">I am happy for Fountain of Grace to keep my answers to help place me where I serve. We keep them private (POPIA).</label></div>'+
    '<button class="btn" id="go">Start</button><div class="err" id="er"></div>'+
    '<div class="foot">About two minutes. Six questions.</div>';
  document.getElementById('go').onclick=()=>{
    const fn=document.getElementById('fn').value.trim();
    const sn=document.getElementById('sn').value.trim();
    const wa=document.getElementById('wa').value.trim();
    const c=document.getElementById('consent').checked;
    const er=document.getElementById('er');
    if(fn.length<2){ er.textContent='Please put your name in.'; return; }
    if(!c){ er.textContent='Please tick the box so we may keep your answers.'; return; }
    person={name:fn, surname:sn, whatsapp:wa};
    i=0; showQ();
  };
}

function progress(){ return Math.round((i/DATA.questions.length)*100); }

function showQ(){
  const q=DATA.questions[i];
  let head = q.safety && q.heading ? '<div class="heading">'+esc(q.heading)+'</div>' : '';
  let disc = q.disclosure ? '<div class="disclosure">'+esc(q.disclosure)+'</div>' : '';
  let opts = q.o.map((t,idx)=>'<button class="opt" data-idx="'+idx+'">'+esc(t)+'</button>').join('');
  wrap.innerHTML =
    '<div class="bar"><i style="width:'+progress()+'%"></i></div>'+
    head+'<div class="q">'+esc(q.q)+'</div>'+opts+disc;
  [...wrap.querySelectorAll('.opt')].forEach(b=>{
    b.onclick=()=>{ answers[q.key]=Number(b.dataset.idx); i++; (i>=DATA.questions.length)?submit():showQ(); };
  });
}

async function submit(){
  wrap.innerHTML='<div class="bar"><i style="width:100%"></i></div><div class="center"><p>Sending...</p></div>';
  try{
    const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({submit_key:SUBMIT_KEY, name:person.name, surname:person.surname, whatsapp:person.whatsapp, consent:true, answers})});
    const d=await r.json();
    if(!d.ok){ wrap.innerHTML='<div class="center"><p>Something went wrong saving. Please try again.</p><button class="btn" onclick="location.reload()">Try again</button></div>'; return; }
    done(d);
  }catch(e){ wrap.innerHTML='<div class="center"><p>No connection. Please try again.</p><button class="btn" onclick="location.reload()">Try again</button></div>'; }
}

function done(d){
  const wired = d.has_wired
    ? 'We have matched this to your "How God wired you" result, so we already know your strengths.'
    : 'If you have not yet done the short "How God wired you" test in our app, please do it too - it tells us your strengths so we place you at your best.';
  wrap.innerHTML =
    '<div class="center"><h1>Thank you, '+esc(person.name)+'</h1>'+
    '<p>'+esc(DATA.outro)+'</p>'+
    '<p class="strong">'+esc(wired)+'</p>'+
    (!d.has_wired ? '<p><a href="/wired/">Do the wired test</a></p>' : '')+
    '<p style="margin-top:22px">You can close this page.</p></div>';
}

boot();
</script>
</body>
</html>
