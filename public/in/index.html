<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sign in - Fountain of Grace</title>
<link rel="icon" href="/favicon.jpg">
<style>
  :root{--bg:#043838;--card:#0a4a4a;--card2:#0f5858;--line:#1c6b6b;--text:#f2fbfa;--dim:#a3cccc;--gold:#ffd700;--good:#7fe0cf}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:460px;margin:0 auto;padding:40px 20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
  h1{font-size:23px;margin:0 0 4px}
  p.sub{color:var(--dim);font-size:15px;margin:0 0 22px}
  label{display:block;font-size:14px;color:var(--dim);margin:14px 2px 6px}
  input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:15px;font-size:17px}
  input.code{letter-spacing:.4em;text-align:center;font-size:26px;font-weight:700}
  .btn{appearance:none;border:0;background:var(--gold);color:#043838;font-weight:800;font-size:17px;border-radius:13px;padding:16px;width:100%;margin-top:20px}
  .btn:disabled{opacity:.5}
  .link{background:none;border:0;color:var(--gold);font-size:15px;margin-top:16px;text-decoration:underline}
  .msg{padding:12px 14px;border-radius:11px;margin-top:14px;font-size:15px;line-height:1.5}
  .msg.bad{background:#2a1a1a;border:1px solid #b5514a;color:#ffd9d5}
  .msg.good{background:#13291f;border:1px solid var(--good);color:#c9f4dd}
  .done{text-align:center}
  .done h1{font-size:26px}
</style>
</head>
<body>
<div class="wrap" id="wrap"><p class="sub">Loading...</p></div>
<script>
const API='https://rmurdihrhcxevtzkrbmx.supabase.co/functions/v1/login-otp';
const wrap=document.getElementById('wrap');
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let EMAIL='';

function screenEmail(){
  wrap.innerHTML=
    '<h1>Sign in</h1><p class="sub">No password. We email you a code, you type it in.</p>'+
    '<label>Your email</label><input id="em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">'+
    '<button class="btn" id="go">Email me a code</button><div id="m"></div>';
  document.getElementById('go').onclick=sendCode;
  document.getElementById('em').addEventListener('keydown',e=>{if(e.key==="Enter")sendCode();});
}
async function sendCode(){
  const em=document.getElementById('em').value.trim().toLowerCase();
  const m=document.getElementById('m');
  if(!em.includes('@')){ m.innerHTML='<div class="msg bad">Please type your email.</div>'; return; }
  const b=document.getElementById('go'); b.textContent='Sending...'; b.disabled=true;
  try{
    await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'request',email:em})});
    EMAIL=em; screenCode();
  }catch(e){ b.textContent='Email me a code'; b.disabled=false; m.innerHTML='<div class="msg bad">No connection. Try again.</div>'; }
}
function screenCode(){
  wrap.innerHTML=
    '<h1>Type your code</h1><p class="sub">We emailed a 6-digit code to <b>'+esc(EMAIL)+'</b>. It works for 10 minutes.</p>'+
    '<label>The 6-digit code</label><input id="code" class="code" inputmode="numeric" maxlength="6" placeholder="000000">'+
    '<button class="btn" id="go">Sign in</button>'+
    '<button class="link" id="resend">Email me a new code</button>'+
    '<button class="link" id="back">Use a different email</button><div id="m"></div>';
  const codeEl=document.getElementById('code');
  codeEl.focus();
  codeEl.addEventListener('input',()=>{ codeEl.value=codeEl.value.replace(/[^0-9]/g,''); if(codeEl.value.length===6) verify(); });
  document.getElementById('go').onclick=verify;
  document.getElementById('resend').onclick=async()=>{ await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'request',email:EMAIL})}); document.getElementById('m').innerHTML='<div class="msg good">A new code is on its way.</div>'; };
  document.getElementById('back').onclick=screenEmail;
}
async function verify(){
  const code=document.getElementById('code').value.trim();
  const m=document.getElementById('m');
  if(!/^[0-9]{6}$/.test(code)){ m.innerHTML='<div class="msg bad">Type the 6 digits from the email.</div>'; return; }
  const b=document.getElementById('go'); b.textContent='Checking...'; b.disabled=true;
  try{
    const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'verify',email:EMAIL,code})});
    const d=await r.json();
    if(d.ok&&d.verified){ done(d); }
    else { b.textContent='Sign in'; b.disabled=false; m.innerHTML='<div class="msg bad">That code was wrong or has expired. Try again, or email a new code.</div>'; document.getElementById('code').value=''; }
  }catch(e){ b.textContent='Sign in'; b.disabled=false; m.innerHTML='<div class="msg bad">No connection. Try again.</div>'; }
}
function done(d){
  wrap.innerHTML='<div class="done"><h1>You are in</h1><p class="sub">Welcome, '+esc(d.name||'')+'. Signed in as <b>'+esc(d.role)+'</b>.</p><p class="sub">This proves the login works. Next it will open your private tools straight from the Hub.</p></div>';
}
screenEmail();
</script>
</body>
</html>
